<style>
  :root {
    --primary: #E84118;
    --secondary: #FF6348;
    --dark: #1A0300;
    --light: #FFF3F0;
    --white: #ffffff;
    --gray-100: #f8f9fa;
    --gray-200: #e9ecef;
    --gray-600: #6c757d;
    --gray-800: #343a40;
    --font: 'Inter', sans-serif;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.16);
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    scroll-behavior: smooth;
    font-size: 16px;
  }

  body {
    font-family: var(--font);
    color: var(--dark);
    background: var(--white);
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ===== HEADER ===== */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 0 24px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(26, 3, 0, 0.0);
    backdrop-filter: blur(0px);
    transition: var(--transition);
  }

  .header.scrolled {
    background: rgba(26, 3, 0, 0.96);
    backdrop-filter: blur(20px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 18px;
    color: var(--white);
    letter-spacing: -1px;
    box-shadow: 0 4px 12px rgba(232, 65, 24, 0.4);
  }

  .logo-text {
    font-size: 22px;
    font-weight: 800;
    color: var(--white);
    letter-spacing: -0.5px;
  }

  .header-nav {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .header-nav a {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: var(--transition);
  }

  .header-nav a:hover {
    color: var(--secondary);
  }

  .btn-contactar {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white) !important;
    padding: 10px 22px;
    border-radius: 50px;
    font-weight: 600 !important;
    font-size: 14px !important;
    text-decoration: none;
    transition: var(--transition);
    box-shadow: 0 4px 14px rgba(232, 65, 24, 0.4);
  }

  .btn-contactar:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(232, 65, 24, 0.5);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 8px;
    background: none;
    border: none;
  }

  .hamburger span {
    width: 24px;
    height: 2px;
    background: var(--white);
    border-radius: 2px;
    transition: var(--transition);
  }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 70px;
    left: 0;
    right: 0;
    background: rgba(26, 3, 0, 0.98);
    backdrop-filter: blur(20px);
    padding: 24px;
    flex-direction: column;
    gap: 16px;
    z-index: 999;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .mobile-menu.open {
    display: flex;
  }

  .mobile-menu a {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    transition: var(--transition);
  }

  .mobile-menu a:hover {
    color: var(--secondary);
  }

  /* ===== HERO ===== */
  .hero {
    height: 100vh;
    min-height: 650px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?w=1400&q=80&fit=crop');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform: scale(1.05);
    transition: transform 8s ease-out;
  }

  .hero-bg.loaded {
    transform: scale(1);
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(26, 3, 0, 0.88) 0%,
      rgba(26, 3, 0, 0.65) 50%,
      rgba(232, 65, 24, 0.25) 100%
    );
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 24px;
    max-width: 900px;
    margin: 0 auto;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--white);
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 28px;
    animation: fadeInDown 0.8s ease forwards;
  }

  .hero-badge .stars {
    color: #FFD700;
    letter-spacing: 2px;
    font-size: 12px;
  }

  .hero-title {
    font-size: clamp(42px, 7vw, 84px);
    font-weight: 900;
    color: var(--white);
    line-height: 1.05;
    letter-spacing: -2px;
    margin-bottom: 20px;
    animation: fadeInUp 0.8s ease 0.2s both;
  }

  .hero-title span {
    background: linear-gradient(135deg, var(--secondary), #FFD700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: clamp(16px, 2.5vw, 20px);
    color: rgba(255,255,255,0.82);
    max-width: 600px;
    margin: 0 auto 36px;
    font-weight: 400;
    line-height: 1.7;
    animation: fadeInUp 0.8s ease 0.4s both;
  }

  .hero-btns {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeInUp 0.8s ease 0.6s both;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white);
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 700;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: var(--transition);
    box-shadow: 0 8px 24px rgba(232, 65, 24, 0.5);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 36px rgba(232, 65, 24, 0.6);
  }

  .btn-outline {
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    color: var(--white);
    padding: 16px 36px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    border: 2px solid rgba(255,255,255,0.3);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: var(--transition);
  }

  .btn-outline:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.5);
    transform: translateY(-3px);
  }

  .hero-scroll {
    position: absolute;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .scroll-indicator {
    width: 28px;
    height: 46px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8px;
  }

  .scroll-dot {
    width: 5px;
    height: 5px;
    background: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: scrollBounce 2s infinite;
  }

  /* ===== STATS BAR ===== */
  .stats-bar {
    background: var(--dark);
    padding: 0;
  }

  .stats-inner {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    max-width: 1200px;
    margin: 0 auto;
  }

  .stat-item {
    padding: 32px 24px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
  }

  .stat-item:last-child {
    border-right: none;
  }

  .stat-item::before {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    transform: scaleX(0);
    transition: var(--transition);
  }

  .stat-item:hover::before {
    transform: scaleX(1);
  }

  .stat-number {
    font-size: 36px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--secondary), #FFD700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 8px;
    display: block;
  }

  .stat-label {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  /* ===== SECTION STYLES ===== */
  section {
    padding: 96px 24px;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .section-tag::before {
    content: '';
    width: 24px;
    height: 2px;
    background: var(--primary);
    border-radius: 2px;
  }

  .section-title {
    font-size: clamp(30px, 4vw, 48px);
    font-weight: 900;
    color: var(--dark);
    line-height: 1.15;
    letter-spacing: -1.5px;
    margin-bottom: 20px;
  }

  .section-title span {
    color: var(--primary);
  }

  .section-desc {
    font-size: 17px;
    color: var(--gray-600);
    line-height: 1.8;
    max-width: 560px;
  }

  /* ===== SOBRE NOSOTROS ===== */
  .sobre-nosotros {
    background: var(--light);
  }

  .sobre-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }

  .sobre-visual {
    position: relative;
  }

  .sobre-img-wrap {
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    aspect-ratio: 4/3;
    position: relative;
  }

  .sobre-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
  }

  .sobre-img-wrap:hover img {
    transform: scale(1.04);
  }

  .sobre-badge-float {
    position: absolute;
    bottom: -24px;
    right: -24px;
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 20px 24px;
    box-shadow: var(--shadow-md);
    text-align: center;
    min-width: 140px;
  }

  .sobre-badge-float .big-num {
    font-size: 40px;
    font-weight: 900;
    color: var(--primary);
    line-height: 1;
    display: block;
  }

  .sobre-badge-float .small-text {
    font-size: 12px;
    color: var(--gray-600);
    font-weight: 500;
    margin-top: 4px;
  }

  .sobre-features {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 36px;
  }

  .sobre-feature {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 16px 20px;
    background: var(--white);
    border-radius: var(--radius-sm);
    border-left: 3px solid var(--primary);
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
  }

  .sobre-feature:hover {
    transform: translateX(4px);
    box-shadow: var(--shadow-md);
  }

  .sobre-feature-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--white);
  }

  .sobre-feature-text h4 {
    font-size: 15px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 4px;
  }

  .sobre-feature-text p {
    font-size: 13px;
    color: var(--gray-600);
    line-height: 1.5;
  }

  /* ===== SERVICIOS ===== */
  .servicios {
    background: var(--white);
  }

  .servicios-header {
    text-align: center;
    max-width: 600px;
    margin: 0 auto 60px;
  }

  .servicios-header .section-desc {
    margin: 0 auto;
    text-align: center;
  }

  .servicios-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }

  .servicio-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    padding: 36px 28px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  .servicio-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    opacity: 0;
    transition: var(--transition);
  }

  .servicio-card:hover::before {
    opacity: 1;
  }

  .servicio-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 24px 48px rgba(232, 65, 24, 0.2);
    border-color: transparent;
  }

  .servicio-card:hover .servicio-icon {
    background: rgba(255,255,255,0.2);
  }

  .servicio-card:hover .servicio-icon svg {
    color: var(--white);
    stroke: var(--white);
  }

  .servicio-card:hover h3,
  .servicio-card:hover p {
    color: var(--white);
  }

  .servicio-card:hover p {
    color: rgba(255,255,255,0.85) !important;
  }

  .servicio-card * {
    position: relative;
    z-index: 1;
  }

  .servicio-icon {
    width: 60px;
    height: 60px;
    background: var(--light);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    transition: var(--transition);
  }

  .servicio-icon svg {
    width: 28px;
    height: 28px;
    color: var(--primary);
    stroke: var(--primary);
    transition: var(--transition);
  }

  .servicio-card h3 {
    font-size: 19px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 12px;
    transition: var(--transition);
  }

  .servicio-card p {
    font-size: 14px;
    color: var(--gray-600);
    line-height: 1.7;
    transition: var(--transition);
  }

  /* ===== RATING ===== */
  .rating-section {
    background: linear-gradient(135deg, var(--dark) 0%, #2d0500 100%);
    padding: 80px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .rating-section::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(232, 65, 24, 0.15) 0%, transparent 70%);
    pointer-events: none;
  }

  .rating-section::after {
    content: '';
    position: absolute;
    bottom: -100px;
    left: -100px;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255, 99, 72, 0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  .rating-inner {
    position: relative;
    z-index: 1;
    max-width: 800px;
    margin: 0 auto;
  }

  .google-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50px;
    padding: 8px 20px;
    margin-bottom: 32px;
  }

  .google-badge span {
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .rating-number {
    font-size: clamp(80px, 15vw, 140px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--secondary), #FFD700);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 16px;
    display: block;
    letter-spacing: -4px;
  }

  .rating-stars-big {
    font-size: 40px;
    letter-spacing: 8px;
    color: #FFD700;
    margin-bottom: 16px;
    display: block;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  }

  .rating-meta {
    color: rgba(255,255,255,0.65);
    font-size: 16px;
    font-weight: 400;
    margin-bottom: 48px;
  }

  .rating-meta strong {
    color: var(--white);
    font-weight: 700;
  }

  .reviews-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-top: 48px;
  }

  .review-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-md);
    padding: 24px;
    text-align: left;
    transition: var(--transition);
  }

  .review-card:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-4px);
  }

  .review-stars {
    color: #FFD700;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .review-text {
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    line-height: 1.7;
    font-style: italic;
    margin-bottom: 16px;
  }

  .review-author {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .review-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--white);
    flex-shrink: 0;
  }

  .review-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--white);
  }

  .review-date {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
  }

  /* ===== POR QUE ELEGIRNOS ===== */
  .porque {
    background: var(--light);
  }

  .porque-header {
    text-align: center;
    max-width: 600px;
    margin: 0 auto 64px;
  }

  .porque-header .section-desc {
    margin: 0 auto;
    text-align: center;
  }

  .pilares-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
  }

  .pilar-card {
    background: var(--white);
    border-radius: var(--radius-lg);
