<style>
  :root {
    --primary: #E84118;
    --secondary: #FF6348;
    --dark: #1A0300;
    --light: #FFF3F0;
    --white: #ffffff;
    --gray-100: #f8f9fa;
    --gray-200: #e9ecef;
    --gray-500: #adb5bd;
    --gray-700: #495057;
    --gray-900: #212529;
    --font: 'Inter', sans-serif;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.12);
    --shadow-lg: 0 16px 48px rgba(0,0,0,0.16);
    --shadow-xl: 0 24px 64px rgba(0,0,0,0.2);
    --radius-sm: 8px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 32px;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
    font-size: 16px;
  }

  body {
    font-family: var(--font);
    color: var(--gray-900);
    background: var(--white);
    overflow-x: hidden;
    line-height: 1.6;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  ul {
    list-style: none;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-track {
    background: var(--light);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--primary);
    border-radius: 3px;
  }

  /* ===== HEADER ===== */
  #header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    padding: 0 2rem;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: var(--transition);
    background: transparent;
  }

  #header.scrolled {
    background: var(--dark);
    box-shadow: var(--shadow-lg);
    height: 64px;
  }

  .header-logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: var(--primary);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--transition);
  }

  .logo-icon svg {
    width: 26px;
    height: 26px;
    fill: var(--white);
  }

  .logo-text {
    display: flex;
    flex-direction: column;
  }

  .logo-name {
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--white);
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .logo-tagline {
    font-size: 0.7rem;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .header-nav {
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .header-nav a {
    color: rgba(255,255,255,0.85);
    font-weight: 500;
    font-size: 0.9rem;
    transition: var(--transition);
    position: relative;
  }

  .header-nav a::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--secondary);
    transition: var(--transition);
  }

  .header-nav a:hover {
    color: var(--white);
  }

  .header-nav a:hover::after {
    width: 100%;
  }

  .btn-contactar {
    background: var(--primary);
    color: var(--white) !important;
    padding: 10px 24px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 0.9rem;
    transition: var(--transition);
    border: 2px solid var(--primary);
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-contactar:hover {
    background: transparent;
    color: var(--white) !important;
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(232,65,24,0.4);
  }

  .btn-contactar::after {
    display: none !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
    background: none;
    border: none;
  }

  .hamburger span {
    display: block;
    width: 26px;
    height: 2px;
    background: var(--white);
    border-radius: 2px;
    transition: var(--transition);
  }

  .hamburger.active span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
  }

  .hamburger.active span:nth-child(2) {
    opacity: 0;
  }

  .hamburger.active span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
  }

  /* Mobile Nav */
  .mobile-nav {
    display: none;
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    background: var(--dark);
    padding: 1.5rem 2rem;
    z-index: 999;
    flex-direction: column;
    gap: 1rem;
    transform: translateY(-20px);
    opacity: 0;
    transition: var(--transition);
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .mobile-nav.open {
    display: flex;
    transform: translateY(0);
    opacity: 1;
  }

  .mobile-nav a {
    color: rgba(255,255,255,0.85);
    font-weight: 500;
    font-size: 1rem;
    padding: 0.5rem 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    transition: var(--transition);
  }

  .mobile-nav a:hover {
    color: var(--secondary);
  }

  /* ===== HERO ===== */
  #hero {
    position: relative;
    height: 100vh;
    min-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1497366216548-37526070297c?w=1400&q=80&fit=crop');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transform: scale(1.05);
    transition: transform 8s ease;
  }

  #hero.loaded .hero-bg {
    transform: scale(1);
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      135deg,
      rgba(26,3,0,0.85) 0%,
      rgba(26,3,0,0.6) 50%,
      rgba(232,65,24,0.3) 100%
    );
  }

  .hero-overlay-2 {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to top,
      rgba(26,3,0,0.8) 0%,
      transparent 60%
    );
  }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem;
    max-width: 900px;
    width: 100%;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--white);
    padding: 8px 20px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 2rem;
    letter-spacing: 0.5px;
    animation: fadeInDown 0.8s ease both;
  }

  .hero-badge .stars {
    color: #FFD700;
    font-size: 0.9rem;
  }

  .hero-title {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 900;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 1.5rem;
    letter-spacing: -2px;
    animation: fadeInUp 0.8s ease 0.2s both;
  }

  .hero-title span {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-subtitle {
    font-size: clamp(1rem, 2vw, 1.25rem);
    color: rgba(255,255,255,0.8);
    margin-bottom: 2.5rem;
    font-weight: 400;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    animation: fadeInUp 0.8s ease 0.4s both;
  }

  .hero-buttons {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    animation: fadeInUp 0.8s ease 0.6s both;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white);
    padding: 16px 36px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1rem;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(232,65,24,0.4);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 48px rgba(232,65,24,0.5);
  }

  .btn-outline {
    background: transparent;
    color: var(--white);
    padding: 16px 36px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 1rem;
    transition: var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 2px solid rgba(255,255,255,0.4);
    cursor: pointer;
    backdrop-filter: blur(8px);
  }

  .btn-outline:hover {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.7);
    transform: translateY(-3px);
  }

  .hero-scroll {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    animation: bounce 2s infinite;
    cursor: pointer;
  }

  .hero-scroll span {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 500;
  }

  .scroll-arrow {
    width: 32px;
    height: 32px;
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== STATS BAR ===== */
  #stats {
    background: var(--dark);
    padding: 1.5rem 2rem;
  }

  .stats-container {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    align-items: center;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 1rem;
    border-right: 1px solid rgba(255,255,255,0.1);
    justify-content: center;
  }

  .stat-item:last-child {
    border-right: none;
  }

  .stat-icon {
    width: 44px;
    height: 44px;
    background: rgba(232,65,24,0.15);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .stat-icon svg {
    width: 22px;
    height: 22px;
    fill: var(--primary);
  }

  .stat-info {
    display: flex;
    flex-direction: column;
  }

  .stat-number {
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--white);
    line-height: 1;
    letter-spacing: -0.5px;
  }

  .stat-label {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 2px;
  }

  /* ===== SECTIONS COMMON ===== */
  section {
    padding: 6rem 2rem;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  .section-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--light);
    color: var(--primary);
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 1rem;
  }

  .section-label::before {
    content: '';
    width: 6px;
    height: 6px;
    background: var(--primary);
    border-radius: 50%;
    flex-shrink: 0;
  }

  .section-title {
    font-size: clamp(1.8rem, 3.5vw, 2.8rem);
    font-weight: 900;
    color: var(--dark);
    line-height: 1.2;
    letter-spacing: -1px;
    margin-bottom: 1rem;
  }

  .section-title span {
    color: var(--primary);
  }

  .section-desc {
    font-size: 1.05rem;
    color: var(--gray-700);
    line-height: 1.7;
    max-width: 600px;
  }

  /* ===== SOBRE NOSOTROS ===== */
  #sobre {
    background: var(--light);
  }

  .sobre-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5rem;
    align-items: center;
  }

  .sobre-image-wrapper {
    position: relative;
  }

  .sobre-image {
    width: 100%;
    height: 480px;
    object-fit: cover;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xl);
  }

  .sobre-badge-float {
    position: absolute;
    bottom: -20px;
    right: -20px;
    background: var(--white);
    border-radius: var(--radius-md);
    padding: 1.25rem 1.5rem;
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid rgba(232,65,24,0.1);
  }

  .sobre-badge-float .icon-wrap {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .sobre-badge-float .icon-wrap svg {
    width: 24px;
    height: 24px;
    fill: var(--white);
  }

  .sobre-badge-float .badge-info strong {
    display: block;
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--dark);
    line-height: 1;
  }

  .sobre-badge-float .badge-info span {
    font-size: 0.75rem;
    color: var(--gray-700);
    font-weight: 500;
  }

  .sobre-accent {
    position: absolute;
    top: -20px;
    left: -20px;
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: var(--radius-md);
    opacity: 0.15;
    z-index: -1;
  }

  .sobre-content .section-desc {
    margin-bottom: 2rem;
    max-width: 100%;
  }

  .sobre-features {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 2rem;
  }

  .sobre-feature {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 1rem;
    background: var(--white);
    border-radius: var(--radius-sm);
    border: 1px solid rgba(232,65,24,0.08);
    transition: var(--transition);
  }

  .sobre-feature:hover {
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }

  .sobre-feature .check {
    width: 20px;
    height: 20px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .sobre-feature .check svg {
    width: 10px;
    height: 10px;
    fill: var(--white);
  }

  .sobre-feature p {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--dark);
    line-height: 1.4;
  }

  /* ===== SERVICIOS ===== */
  #servicios {
    background: var(--white);
  }

  .servicios-header {
    text-align: center;
    margin-bottom: 4rem;
  }

  .servicios-header .section-desc {
    margin: 0 auto;
  }

  .servicios-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }

  .servicio-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-md);
    padding: 2rem;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
    cursor: default;
  }

  .servicio-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    opacity: 0;
    transition: var(--transition);
    z-index: 0;
  }

  .servicio-card:hover::before {
    opacity: 1;
  }

  .servicio-card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-xl);
    border-color: transparent;
  }

  .servicio-card * {
    position: relative;
    z-index: 1;
  }

  .servicio-icon {
    width: 60px;
    height: 60px;
    background: var(--light);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    transition: var(--transition);
  }

  .servicio-card:hover .servicio-icon {
    background: rgba(255,255,255,0.2);
  }

  .servicio-icon svg {
    width: 30px;
    height: 30px;
    fill: var(--primary);
    transition: var(--transition);
  }

  .servicio-card:hover .servicio-icon svg {
    fill: var(--white);
  }

  .servicio-title {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 0.75rem;
    transition: var(--transition);
  }

  .servicio-card:hover .servicio-title {
    color: var(--white);
  }

  .servicio-desc {
    font-size: 0.9rem;
    color: var(--gray-700);
    line-height: 1.6;
    transition: var(--transition);
  }

  .servicio-card:hover .servicio-desc {
    color: rgba(255,255,255,0.85);
  }

  .servicio-arrow {
    width: 32px;
    height: 32px;
    background: var(--light);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1.5rem;
    transition: var(--transition);
  }

  .servicio-arrow svg {
    width: 16px;
    height: 16px;
    fill: var(--primary);
    transition: var(--transition);
  }

  .servicio-card:hover .servicio-arrow {
    background: rgba(255,255,255,0.25);
  }

  .servicio-card:hover .servicio-arrow svg {
    fill: var(--white);
  }

  /* ===== RATING SECTION ===== */
  #rating {
    background: linear-gradient(135deg, var(--dark) 0%, #2d0800 100%);
    padding: 6rem 2rem;
    position: relative;
    overflow: hidden;
  }

  #rating::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(232,65,24,0.15) 0%, transparent 70%);
    border-radius: 50%;
  }

  #rating::after {
    content: '';
    position: absolute;
    bottom: -30%;
    left: -5%;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(255,99,72,0.1) 0%, transparent 70%);
    border-radius: 50%;
  }

  .rating-container {
    max-width: 900px;
    margin: 0 auto;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .google-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    padding: 10px 20px;
    border-radius: 50px;
    margin-bottom: 2.5rem;
  }

  .google-badge svg {
    width: 22px;
    height: 22px;
  }

  .google-badge span {
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .rating-big {
    font-size: clamp(5rem, 12vw, 10rem);
    font-weight: 900;
    color: var(--white);
    line-height: 1;
    letter-spacing: -4px;
    margin-bottom: 1rem;
  }

  .rating-big span {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .rating-stars {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .rating-stars svg {
    width: 36px;
    height: 36px;
    fill: #FFD700;
    filter: drop-shadow(0 0 8px rgba(255,215,0,0.5));
  }

  .rating-text {
    font-size: 1.1rem;
    color: rgba(255,255,255,0.7);
    font-weight: 400;
    margin-bottom: 3rem;
  }

  .rating-text strong {
    color: var(--white);
    font-weight: 700;
  }

  .reviews-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.5rem;
  }

  .review-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: var(--radius-md);
    padding: 1.5rem;
    text-align: left;
    transition: var(--transition);
    backdrop-filter: blur(8px);
  }

  .review-card:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-4px);
    border-color: rgba(232,65,24,0.3);
  }

  .review-header
